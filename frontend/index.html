<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- El emblema tricolor del logo del INIAF, recortado del original de
         public/iniaf/ (el logo entero, con texto, no se lee a 16 px). -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema de Almacenes · INIAF</title>
    <!--
      Aplica el tema ANTES del primer pintado. El ThemeProvider lo hace en un
      efecto, que corre despues de montar: con el oscuro por defecto eso se veia
      como un fogonazo blanco en cada carga. Tiene que quedar en sintonia con
      main.tsx: mismo storageKey ("theme") y mismo default ("dark").
    -->
    <script>
      ;(function () {
        try {
          var guardado = localStorage.getItem("theme")
          var tema =
            guardado === "light" || guardado === "dark"
              ? guardado
              : guardado === "system"
                ? window.matchMedia("(prefers-color-scheme: dark)").matches
                  ? "dark"
                  : "light"
                : "dark"
          document.documentElement.classList.add(tema)
        } catch (error) {
          // localStorage bloqueado (modo privado): se cae al default.
          document.documentElement.classList.add("dark")
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
