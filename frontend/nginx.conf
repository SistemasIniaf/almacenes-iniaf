# Frontend + proxy de la API, los dos bajo el MISMO origen — es lo que le
# permite al build de producción no depender de ninguna IP/dominio (ver
# `urlBaseApi()` en `src/lib/api.ts`).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Cabeceras de endurecimiento (2026-11-18): que el navegador no adivine el
    # tipo de un archivo servido, y que el sistema no se pueda embeber en un
    # iframe de otro sitio (clickjacking).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # API del backend (NestJS), mismo prefijo que usa la app (`API_PREFIX`).
    location /api/v1/ {
        proxy_pass http://backend:3000/api/v1/;

        # Por defecto nginx corta en 1 MB: rechazaba (413) fotos de ítem que
        # el backend acepta hasta 5 MB, y la importación de saldos iniciales
        # (miles de filas en JSON). Y la importación es UNA transacción larga.
        client_max_body_size 20m;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Imagenes de items y lotes: estaticas publicas del backend, fuera del
    # prefijo de la API (ver CLAUDE.md, seccion "Imagenes").
    location /uploads/ {
        proxy_pass http://backend:3000/uploads/;
        proxy_set_header Host $host;
    }

    # SPA con react-router (createBrowserRouter): sin esto, refrescar en
    # /usuarios o /ingresos/123 da 404 porque esos paths no son archivos reales.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
