# Frontend + proxy de la API, los dos bajo el MISMO origen — es lo que le
# permite al build de producción no depender de ninguna IP/dominio (ver
# `urlBaseApi()` en `src/lib/api.ts`).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API del backend (NestJS), mismo prefijo que usa la app (`API_PREFIX`).
    location /api/v1/ {
        proxy_pass http://backend:3000/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Imagenes de items y lotes: estaticas publicas del backend, fuera del
    # prefijo de la API (ver CLAUDE.md, seccion "Imagenes").
    location /uploads/ {
        proxy_pass http://backend:3000/uploads/;
        proxy_set_header Host $host;
    }

    # SPA con react-router (createBrowserRouter): sin esto, refrescar en
    # /usuarios o /ingresos/123 da 404 porque esos paths no son archivos reales.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
